# Config for Dependabot updates. See Documentation here:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Update GitHub actions in workflows
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 25
    directory: "/"
    schedule:
      interval: "monthly"

  # Update production and development requirements in pyproject.toml.
  - package-ecosystem: "pip"
    open-pull-requests-limit: 50
    directory: "/"
    schedule:
      interval: "monthly"
    # Preserve >= lower bounds; raise < upper bounds only when necessary.
    # Releases already allowed by the range do not need a manifest update.
    versioning-strategy: "increase-if-necessary"
    # No standalone lockfile updates. Refresh the lockfile alongside manifest
    # changes before merging; keep this job on pip rather than uv.
    exclude-paths:
      - "uv.lock"
